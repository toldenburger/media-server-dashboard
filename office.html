<html lang="en">
<head>

<title>Office · {{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a19'/%3E%3Cpath d='M5 21l6-7 5 4 10-10' fill='none' stroke='%233987e5' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #0a0e1a; --glass: rgba(255, 255, 255, .065); --edge: rgba(255, 255, 255, .14);
  --text: #f5f5f7; --muted: rgba(235, 235, 245, .62);
  --good: #30d158; --warning: #fab219; --critical: #ff5f57;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; background:
  radial-gradient(50vw 50vw at 12% 8%, rgba(64, 110, 255, .38), transparent 70%),
  radial-gradient(45vw 45vw at 88% 22%, rgba(150, 70, 235, .3), transparent 70%),
  radial-gradient(55vw 55vw at 72% 100%, rgba(0, 170, 190, .26), transparent 70%),
  radial-gradient(40vw 40vw at 15% 90%, rgba(225, 80, 130, .16), transparent 70%), var(--bg); }
#page { margin: 0 auto; padding: 14px 20px 8px; }
header { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; margin-bottom: 8px; padding: 0 4px; }
h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
header a { margin-left: auto; color: var(--text); text-decoration: none; font-size: 13px; padding: 6px 14px; border-radius: 12px; }
#summary { color: var(--muted); font-size: 13px; }
.hint { position: absolute; left: 0; right: 0; bottom: 6px; color: var(--muted); font-size: 12px; text-align: center; pointer-events: none; }
.glass, #tip { background: var(--glass); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(28px) saturate(170%); backdrop-filter: blur(28px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 10px 30px rgba(0, 0, 0, .22); }

#scene { position: relative; height: calc(100vh - 64px); min-height: 360px; touch-action: none; }
#scene canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#scene canvas:active { cursor: grabbing; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.label { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; will-change: transform; }
.tag { pointer-events: auto; cursor: default; display: flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 12px; background: rgba(255, 255, 255, .94); color: #1b1f2e; font-size: 12px; font-weight: 600; white-space: nowrap; box-shadow: 0 4px 12px rgba(0, 0, 0, .18); position: relative; }
.tag span { font-weight: 500; color: #2e9d5b; }
.tag span:empty { display: none; }
.tag span.busy { color: #2563c9; }
.tag span.out { color: #d43b33; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.dot.warning { background: var(--warning); }
.dot.error { background: var(--critical); }
.badge { position: absolute; right: -14px; top: -14px; width: 26px; height: 26px; border-radius: 50%; display: none; place-items: center; font-style: normal; font-weight: 800; font-size: 14px; color: #a76400; background: #fff; border: 3px solid var(--warning); pointer-events: auto; cursor: help; box-shadow: 0 4px 12px rgba(0, 0, 0, .2); }
.badge.error { color: #c0302a; border-color: var(--critical); }
.badge.show { display: grid; }
@media (max-width: 700px) {
  #page { padding: 16px 16px 20px; }
  #scene { height: 115vw; min-height: 0; }
  .hint { position: static; margin-top: 4px; }
  .tag { font-size: 10px; padding: 2px 7px; gap: 4px; }
  .badge { width: 20px; height: 20px; font-size: 11px; right: -10px; top: -10px; }
}
.pile { pointer-events: auto; cursor: default; position: absolute; left: 0; top: 0; padding: 2px 8px; border-radius: 10px; background: rgba(255, 255, 255, .9); color: #4a3520; font-size: 11px; font-weight: 600; white-space: nowrap; }
#tip { position: fixed; display: none; pointer-events: none; z-index: 100000; max-width: 340px; overflow-wrap: anywhere; background: rgba(40, 42, 54, .85); border-radius: 12px; padding: 7px 11px; font-size: 12px; white-space: pre-line; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<body>
<div id="page">
  <header><h1>The Office</h1><span id="summary"></span><a class="glass" href="/">← Dashboard</a></header>
  <div id="scene"><div id="labels"></div><div class="hint">Drag to turn the room · scroll or pinch to zoom</div></div>
  <div class="sr" id="srStatus" aria-live="polite"></div>
</div>
<div id="tip"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '/vendor/OrbitControls.js';
import { RoundedBoxGeometry } from '/vendor/RoundedBoxGeometry.js';

const $ = (id) => document.getElementById(id);
const host = $('scene');

// ---------- renderer, camera, light ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
host.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
camera.position.set(29, 20, 32);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minPolarAngle = 0.55;
controls.maxPolarAngle = 1.2;
controls.minAzimuthAngle = -0.15;
controls.maxAzimuthAngle = Math.PI / 2 + 0.15;
controls.minZoom = 0.8;
controls.maxZoom = 3.5;

scene.add(new THREE.HemisphereLight(0xffffff, 0xcdbfae, 1.45));
const sun = new THREE.DirectionalLight(0xfff1e0, 2.4);
sun.position.set(10, 18, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -17, right: 17, top: 14, bottom: -14, near: 1, far: 50 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const lampGlow = new THREE.PointLight(0xffc98a, 6, 6, 1.6);
lampGlow.position.set(9.3, 2.2, -7.6);
scene.add(lampGlow);

// Frame the whole room as tightly as the window allows: measure its real outline from the camera.
const ROOM_CORNERS = [];
for (const x of [-12.4, 12.4]) for (const z of [-9.4, 9.4]) ROOM_CORNERS.push(new THREE.Vector3(x, -0.85, z), new THREE.Vector3(x, 0, z));
ROOM_CORNERS.push(new THREE.Vector3(-12.4, 3.65, -9.4), new THREE.Vector3(12.4, 3.65, -9.4), new THREE.Vector3(-12.4, 3.65, 9.4));
const corner = new THREE.Vector3();
function fitView() {
  const w = host.clientWidth, h = host.clientHeight, aspect = w / h;
  camera.updateMatrixWorld();
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of ROOM_CORNERS) {
    corner.copy(p).applyMatrix4(camera.matrixWorldInverse);
    x0 = Math.min(x0, corner.x); x1 = Math.max(x1, corner.x); y0 = Math.min(y0, corner.y); y1 = Math.max(y1, corner.y);
  }
  y1 += (y1 - y0) * 0.05;  // space for the name tags along the top
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  let hw = (x1 - x0) / 2 * 1.02, hh = (y1 - y0) / 2 * 1.02;
  if (hw / hh > aspect) hh = hw / aspect; else hw = hh * aspect;
  Object.assign(camera, { left: cx - hw, right: cx + hw, top: cy + hh, bottom: cy - hh });
  camera.updateProjectionMatrix();
}
controls.addEventListener('change', fitView);
function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  camera.lookAt(controls.target);
  fitView();
  renderer.setSize(w, h, false);
  outline.uniforms.res.value.set(w, h);
}
addEventListener('resize', resize);

// ---------- building blocks ----------
const mats = new Map();
function mat(color, extra) {
  if (extra) return new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...extra });
  if (!mats.has(color)) mats.set(color, new THREE.MeshStandardMaterial({ color, roughness: 0.75 }));
  return mats.get(color);
}
function add(geo, material, x, y, z, parent = scene, shadows = true) {
  const m = new THREE.Mesh(geo, typeof material === 'string' ? mat(material) : material);
  m.position.set(x, y, z);
  m.castShadow = shadows;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
const geoCache = new Map();
const cached = (key, make) => geoCache.get(key) || geoCache.set(key, make()).get(key);
// Soft rounded boxes are what make it look like a toy room rather than a diagram.
const rbox = (w, h, d, r, c, x, y, z, p) => add(cached(`rb${w},${h},${d},${r}`, () => new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2, h / 2, d / 2))), c, x, y, z, p);
const box = (w, h, d, c, x, y, z, p) => add(cached(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d)), c, x, y, z, p);
const cyl = (r1, r2, h, c, x, y, z, p, seg = 24) => add(cached(`c${r1},${r2},${h},${seg}`, () => new THREE.CylinderGeometry(r1, r2, h, seg)), c, x, y, z, p);
const ball = (r, c, x, y, z, p) => add(cached(`s${r}`, () => new THREE.SphereGeometry(r, 28, 20)), c, x, y, z, p);
const capsule = (r, len, c, x, y, z, p) => add(cached(`k${r},${len}`, () => new THREE.CapsuleGeometry(r, Math.max(0.001, len - 2 * r), 6, 14)), c, x, y, z, p);
const torus = (r, t, arc, c, x, y, z, p) => add(cached(`t${r},${t},${arc}`, () => new THREE.TorusGeometry(r, t, 10, 28, arc)), c, x, y, z, p);
function group(x, y, z, parent = scene, ry = 0) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = ry;
  parent.add(g);
  return g;
}
function canvasTexture(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  tex.redraw = (...a) => { draw(cv.getContext('2d'), w, h, ...a); tex.needsUpdate = true; };
  tex.redraw();
  return tex;
}
function plane(w, h, material, x, y, z, ry = 0, rx = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, 0);
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// ---------- the room: 24 x 18, office on the left, break room on the right ----------
rbox(24.8, 0.8, 18.8, 0.15, '#d6bea0', 0, -0.4, 0).castShadow = false;
box(24.9, 0.08, 18.9, '#c8ad8c', 0, -0.82, 0).castShadow = false;
const tiles = canvasTexture(256, 256, (g, w, h) => {
  g.fillStyle = '#e8dcc8'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(6, 6, w / 2, h / 2);
  g.strokeStyle = 'rgba(150,120,90,.2)'; g.lineWidth = 4; g.strokeRect(0, 0, w, h);
});
tiles.wrapS = tiles.wrapT = THREE.RepeatWrapping;
tiles.repeat.set(6.3, 9);
plane(12.6, 18, new THREE.MeshStandardMaterial({ map: tiles, roughness: 0.85 }), -5.7, 0.002, 0, 0, -Math.PI / 2);
const wood = canvasTexture(512, 512, (g, w, h) => {
  for (let i = 0; i < 8; i++) {
    const shade = 200 + ((i * 53) % 25);
    g.fillStyle = `rgb(${shade + 20},${shade - 15},${shade - 60})`;
    g.fillRect(0, i * 64, w, 64);
    g.fillStyle = 'rgba(120,80,40,.25)'; g.fillRect(0, i * 64, w, 3);
    g.fillRect(((i * 197) % 400) + 40, i * 64, 3, 64);
    g.strokeStyle = 'rgba(140,95,50,.12)'; g.lineWidth = 2;
    for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(0, i * 64 + 14 + k * 12); g.bezierCurveTo(150, i * 64 + 8 + k * 12, 350, i * 64 + 22 + k * 12, w, i * 64 + 12 + k * 12); g.stroke(); }
  }
});
wood.wrapS = wood.wrapT = THREE.RepeatWrapping;
wood.repeat.set(3, 4.5);
plane(11.4, 18, new THREE.MeshStandardMaterial({ map: wood, roughness: 0.7 }), 6.3, 0.002, 0, 0, -Math.PI / 2);
box(0.12, 0.02, 18, '#c4a882', 0.6, 0.012, 0);

// walls with skirting and caps
box(24.6, 3.4, 0.3, '#f1ebe5', 0, 1.7, -9.15);
box(0.3, 3.4, 18.6, '#d6d4de', -12.15, 1.7, 0);
box(24.2, 0.18, 0.06, '#e2d5c6', 0, 0.09, -8.98);
box(0.06, 0.18, 18.2, '#c4c1cd', -11.98, 0.09, 0);
rbox(24.8, 0.22, 0.42, 0.06, '#e6dacd', 0, 3.48, -9.12);
rbox(0.42, 0.22, 18.8, 0.06, '#c9c6d2', -12.12, 3.48, 0);
box(11.4, 1.0, 0.04, '#e9d9cc', 6.3, 0.62, -8.98); // wainscot in the break room
box(11.4, 0.05, 0.08, '#d9c4b2', 6.3, 1.13, -8.96);

// windows: frame, sill, mullions, a little sky
// The sky follows the real sun over your location. ?hour=21 previews another time of day.
let LAT = 52.37, LON = 4.9;
const nowDate = () => { const h = new URLSearchParams(location.search).get('hour'); const d = new Date(); if (h !== null) d.setHours(Math.floor(+h), (+h % 1) * 60, 0, 0); return d; };
function sunAltitude(d = nowDate()) {
  const rad = Math.PI / 180, day = (d - Date.UTC(d.getUTCFullYear(), 0, 0)) / 86400000, b = 2 * Math.PI * (day - 81) / 364;
  const decl = -23.44 * rad * Math.cos(2 * Math.PI / 365 * (day + 10)), eqt = 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
  const ha = (d.getUTCHours() + d.getUTCMinutes() / 60 + LON / 15 + eqt / 60 - 12) * 15 * rad;
  return Math.asin(Math.sin(LAT * rad) * Math.sin(decl) + Math.cos(LAT * rad) * Math.cos(decl) * Math.cos(ha)) / rad;
}
// [sun altitude, top colour, bottom colour]: night, dusk, golden hour, day
const SKY_STOPS = [[-12, '#070b24', '#16224a'], [-4, '#2b2f66', '#c76f6b'], [3, '#6f7fc4', '#f6b27a'], [14, '#8cc6f2', '#dff0fb']];
function skyColors(alt) {
  const hi = SKY_STOPS.findIndex(([a]) => alt <= a);
  if (hi <= 0) return hi === 0 ? [SKY_STOPS[0][1], SKY_STOPS[0][2]] : [SKY_STOPS[3][1], SKY_STOPS[3][2]];
  const [a0, t0, b0] = SKY_STOPS[hi - 1], [a1, t1, b1] = SKY_STOPS[hi], k = (alt - a0) / (a1 - a0);
  return [new THREE.Color(t0).lerp(new THREE.Color(t1), k).getStyle(), new THREE.Color(b0).lerp(new THREE.Color(b1), k).getStyle()];
}
const sky = canvasTexture(256, 256, (g, w, h, alt = sunAltitude()) => {
  const [top, bottom] = skyColors(alt);
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom);
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const dark = Math.min(1, Math.max(0, (3 - alt) / 12));  // 0 by day, 1 at night
  g.fillStyle = `rgba(255,255,255,${0.9 - dark * 0.7})`;
  for (const [x, y, r] of [[60, 70, 22], [85, 62, 28], [112, 72, 20], [180, 150, 18], [200, 142, 24], [222, 152, 16]]) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  g.fillStyle = `rgba(255,255,240,${dark})`;
  for (const [x, y, r] of [[30, 30, 1.6], [150, 24, 1.2], [210, 60, 1.8], [90, 110, 1.2], [240, 120, 1.4], [20, 150, 1.2], [130, 190, 1.6], [60, 220, 1.2], [200, 210, 1.5]]) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
});
const skyMat = new THREE.MeshStandardMaterial({ map: sky, emissiveMap: sky, emissive: '#ffffff', emissiveIntensity: 0.55 });
function windowAt(x) {
  plane(2.3, 1.6, skyMat, x, 2.05, -8.99);
  const frame = '#fbfaf7';
  box(2.5, 0.1, 0.1, frame, x, 2.9, -8.96); box(2.5, 0.1, 0.1, frame, x, 1.2, -8.96);
  box(0.1, 1.8, 0.1, frame, x - 1.2, 2.05, -8.96); box(0.1, 1.8, 0.1, frame, x + 1.2, 2.05, -8.96);
  box(0.06, 1.6, 0.06, frame, x, 2.05, -8.95); box(2.3, 0.05, 0.06, frame, x, 2.3, -8.95);
  rbox(2.7, 0.08, 0.32, 0.03, frame, x, 1.17, -8.85);
}
const WINDOWS = [1.7, 4.5, 10.2];
WINDOWS.forEach(windowAt);


// the "watching" board beside the fridge: a circle per person, green while they watch
function fitText(g, text, max) {
  if (g.measureText(text).width <= max) return text;
  while (text.length > 1 && g.measureText(text + '…').width > max) text = text.slice(0, -1);
  return text.trimEnd() + '…';
}
// The TV above the couch shows who is watching: a circle per person that lights up while they watch.
const BOARD_W = 560, BOARD_H = 260;
function boardCircles(n) {
  const gap = Math.min(150, (BOARD_W - 80) / Math.max(1, n)), x0 = BOARD_W / 2 - (gap * (n - 1)) / 2;
  return Array.from({ length: n }, (_, i) => ({ cx: x0 + i * gap, cy: 132, r: 44 }));
}
const board = canvasTexture(BOARD_W * 2, BOARD_H * 2, (g, w, h, d) => {
  g.setTransform(2, 0, 0, 2, 0, 0);
  const font = '-apple-system, Helvetica, sans-serif';
  g.fillStyle = '#1a1730'; g.fillRect(0, 0, BOARD_W, BOARD_H);
  g.fillStyle = '#f6d77a'; g.font = `600 26px ${font}`; g.fillText('WATCHING', 28, 44);
  if (!d) return;
  boardCircles(d.viewers.length).forEach(({ cx, cy, r }, i) => {
    const v = d.viewers[i];
    g.save();
    if (v.watching) { g.shadowColor = '#30d158'; g.shadowBlur = 28; }
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2);
    g.fillStyle = v.watching ? '#30d158' : 'rgba(255,255,255,.08)'; g.fill();
    g.restore();
    g.lineWidth = 3; g.strokeStyle = v.watching ? '#9ff5b8' : 'rgba(255,255,255,.22)';
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = v.watching ? '#06240f' : 'rgba(233,236,242,.75)'; g.font = `700 34px ${font}`; g.fillText(v.initials, cx, cy + 2);
    g.fillStyle = v.watching ? '#e9ecf2' : 'rgba(235,235,245,.6)'; g.font = `500 19px ${font}`; g.fillText(v.name, cx, cy + r + 24);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  });
});
rbox(2.95, 1.42, 0.1, 0.06, '#2a2640', 7.35, 2.15, -8.95);
const boardScreen = plane(2.8, 1.3, new THREE.MeshStandardMaterial({ map: board, emissiveMap: board, emissive: '#ffffff', emissiveIntensity: 0.55 }), 7.35, 2.15, -8.89);

// the four newest arrivals as tall framed movie posters, each with a little picture light
// Spread evenly along the wall between the left corner and the fridge, with equal space around each.
const POSTER_H = 2.75, POSTER_W = POSTER_H * 2 / 3, WALL_FROM = -11.85, WALL_TO = -0.55;
const POSTER_GAP = (WALL_TO - WALL_FROM - 4 * POSTER_W) / 5;
const posterLoader = new THREE.TextureLoader();
const wallPosters = [0, 1, 2, 3].map((i) => {
  const x = WALL_FROM + POSTER_GAP + POSTER_W / 2 + i * (POSTER_W + POSTER_GAP), y = 0.32 + POSTER_H / 2;
  rbox(POSTER_W + 0.14, POSTER_H + 0.14, 0.08, 0.03, '#1b1b22', x, y, -8.96);
  const material = new THREE.MeshStandardMaterial({ color: '#2c3456', roughness: 0.55 });
  const mesh = plane(POSTER_W, POSTER_H, material, x, y, -8.91);
  box(0.04, 0.04, 0.3, '#2c3140', x, y + POSTER_H / 2 + 0.2, -8.82);
  rbox(0.5, 0.07, 0.1, 0.03, mat('#2c3140', { emissive: '#ffe9b8', emissiveIntensity: 0.15 }), x, y + POSTER_H / 2 + 0.18, -8.66).rotation.x = 0.5;
  return { mesh, material, url: null };
});
function showPosters(items) {
  wallPosters.forEach((p, i) => {
    const m = items[i];
    p.mesh.userData.poster = m ? `${m.title}${m.sub ? ` (${m.sub})` : ''}\nNew in the library` : null;
    const url = m && m.poster;
    if (url === p.url) return;
    p.url = url;
    if (!url) { p.material.map = null; p.material.color.set('#2c3456'); p.material.needsUpdate = true; return; }
    posterLoader.load('/poster?u=' + encodeURIComponent(url), (tex) => {
      if (p.url !== url) return;

function beanBag(x, z, color, ry) {
  const geo = new THREE.SphereGeometry(0.75, 40, 28);
  const pos = geo.attributes.position, p = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i);
    if (p.y < 0) p.y *= 0.35; else p.y *= 0.75;
    if (p.y > 0.3) p.y -= (1 - Math.min(1, Math.hypot(p.x, p.z) / 0.5)) * 0.18;
    p.multiplyScalar(1 + Math.sin(p.x * 7) * Math.cos(p.z * 6) * 0.035);
    pos.setXYZ(i, p.x, p.y, p.z);
  }
  geo.computeVertexNormals();
  const m = add(geo, mat(color, { roughness: 0.95 }), x, 0.26, z);
  m.rotation.y = ry;
  return m;
}

const dcState = { cpu: 0, mem: 0, traffic: 0 };
function updateDataCenter(d) {

  racks[2].segs.forEach((seg, k) => { seg.material = k < Math.round(Math.min(1, dcState.traffic / NET_FULL) * 10) ? segLit[k] : segDim; });
  racks[1].segs.forEach((seg, k) => { seg.material = k < Math.round(dcState.mem / 10) ? segLit[k] : segDim; });
  miniGlow.material.emissiveIntensity = 0.3 + dcState.cpu / 100 * 2.2;
  dcLight.intensity = 1 + dcState.cpu / 100 * 6;
  const drives = d.disks.map((x) => ({ name: x.name, total: x.total, free: x.free, used: x.total - x.free, pct: (x.total - x.free) / x.total * 100 }))
    .concat((d.cinema.missing_drives || []).map((n) => ({ name: n, missing: true }))).slice(0, driveMonitors.length);
  driveRacks.forEach((r, i) => {
    const dr = drives[i];
    r.g.visible = !!dr;
    if (!dr) return;
    const lit = dr.missing ? 0 : Math.round(dr.pct / 10);
    r.segs.forEach((seg, k) => { seg.material = k < lit ? segLit[k] : segDim; });
    r.missing = !!dr.missing;
    const text = dr.missing ? `${dr.name} · off` : `${dr.name} · ${Math.round(dr.pct)}%`;
    if (text !== r.text) { r.text = text; r.tag.redraw(text.toUpperCase()); }
  });
  driveMonitors.forEach((m, i) => {
    m.g.visible = i < drives.length;
    // centre however many monitors are showing over the middle rack
    m.g.position.z = 6.9 + (i - (Math.min(drives.length, driveMonitors.length) - 1) / 2) * 1.2;
    const key = JSON.stringify(drives[i] || null);
    if (m.g.visible && key !== m.key) { m.key = key; m.tex.redraw(drives[i]); }
  });
  const issues = d.alerts.filter((a) => ['CPU', 'Memory', 'Network', 'Drives'].includes(a.source));
  dcTag.querySelector('.dot').className = 'dot ' + (issues.some((a) => a.level === 'error') ? 'error' : issues.length ? 'warning' : '');
  dcTag.querySelector('span').textContent = `CPU ${dcState.cpu}% · Mem ${Math.round(dcState.mem)}% · ↓ ${fmtMbit(last(h.rx))}`;
  const badge = dcTag.querySelector('.badge');

  badge.classList.toggle('error', issues.some((a) => a.level === 'error'));
  if (issues.length) badge.dataset.tip = issues.map((a) => `${a.source}: ${a.message}`).join('\n'); else delete badge.dataset.tip;
}
function animateDataCenter(dt) {
  fan.rotation.z -= dt * (3 + dcState.cpu / 100 * 25);
  const busy = Math.min(1, dcState.traffic / NET_FULL);
  for (const [r, rack] of racks.entries()) {
    const chance = r === 2 ? 0.04 + busy * 0.5 : 0.02 + dcState.cpu / 100 * 0.2;
    for (const led of rack.leds) if (Math.random() < chance) led.material = led.material === ledOff ? ledOn[led.userData.color] : ledOff;
  }
  for (const r of driveRacks) for (const led of r.leds) if (Math.random() < (r.missing ? 0 : 0.03 + busy * 0.3)) led.material = led.material === ledOff ? ledOn.blue : ledOff;

}

// The workers are cel-shaded with a thin ink outline, so they read as cartoon characters rather than clay.
const toonSteps = new THREE.DataTexture(new Uint8Array([110, 110, 110, 255, 185, 185, 185, 255, 255, 255, 255, 255]), 3, 1);
toonSteps.minFilter = toonSteps.magFilter = THREE.NearestFilter;
toonSteps.needsUpdate = true;
const toonMats = new Map();
function toon(color) {
  const key = color.getHexString();
  if (!toonMats.has(key)) toonMats.set(key, new THREE.MeshToonMaterial({ color: color.clone(), gradientMap: toonSteps }));
  return toonMats.get(key);
}
const outline = new THREE.ShaderMaterial({
  uniforms: { px: { value: 1.4 }, res: { value: new THREE.Vector2(1, 1) }, color: { value: new THREE.Color('#2b2433') } },
  vertexShader: `uniform float px; uniform vec2 res;
    void main() {
      vec4 clip = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      vec2 n = (mat3(projectionMatrix) * normalMatrix * normal).xy;
      clip.xy += (length(n) > 0.0001 ? normalize(n) : vec2(0.0)) * px * 2.0 / res * clip.w;
      gl_Position = clip;
    }`,
  fragmentShader: `uniform vec3 color; void main() { gl_FragColor = vec4(color, 1.0); }`,
  side: THREE.BackSide,
});
function cartoon(rootObj) {
  const meshes = [];
  rootObj.traverse((o) => { if (o.isMesh) meshes.push(o); });
  for (const m of meshes) {
    if (m.material.transparent) continue;
    m.material = toon(m.material.color);
    if (m.userData.noOutline) continue;
    if (!m.geometry.boundingSphere) m.geometry.computeBoundingSphere();
    if (m.geometry.boundingSphere.radius < 0.05) continue;
    const ink = new THREE.Mesh(m.geometry, outline);
    ink.castShadow = false;
    ink.raycast = () => {};
    m.add(ink);
  }
}

const people = {};
function seatOf(p) { const d = DESKS[p.i]; return { at: [d[0], d[1] + 0.88], face: Math.PI, pose: 'type' }; }
function place(p, spot) { p.root.position.set(spot.at[0], 0, spot.at[1]); p.root.rotation.y = spot.face; p.pose = spot; }

function send(p, where, instant) {
  if (p.where === where) return;
  const from = p.where;
  p.where = where;
  const spot = where === 'desk' ? seatOf(p) : BREAKS[p.i % BREAKS.length];
  if (instant || !from) { p.path = []; return place(p, spot); }
  const aisle = AISLES[DESKS[p.i][1] > 0 ? 1 : 0];
  const brk = BREAKS[p.i % BREAKS.length];
  const toBreak = [[DESKS[p.i][0], aisle], [CORRIDOR, aisle], ...(brk.via || []), brk.at];
  p.path = (where === 'desk' ? [...toBreak.slice(0, -1).reverse(), spot.at] : toBreak).map(([x, z]) => new THREE.Vector3(x, 0, z));
  p.pose = null;
  p.arrive = spot;
}

const SPEED = 2.4;
function animate(p, dt, t) {
  const { root, body, head } = p;
  const pose = p.pose?.pose;
  p.cup.visible = pose === 'coffee';
  p.paddle.visible = pose === 'pingpong';
  // blink now and then
  const blink = ((t + p.phase * 3) % 4.3) < 0.12;
  for (const e of p.eyes) e.scale.y = e.userData.sy * (blink ? 0.12 : 1);
  body.rotation.x = 0; body.position.y = 0;
  p.shoulderL.rotation.z = p.shoulderR.rotation.z = 0;
  p.elbowL.rotation.x = p.elbowR.rotation.x = -0.15;
  head.rotation.set(0, Math.sin(t * 0.4 + p.phase) * 0.15, 0);

  if (p.path.length) {
    const next = p.path[0], pos = root.position;
    const dx = next.x - pos.x, dz = next.z - pos.z, dist = Math.hypot(dx, dz);
    const step = SPEED * dt;
    if (dist <= step) { pos.copy(next); p.path.shift(); if (!p.path.length) place(p, p.arrive); }
    else {
      pos.x += dx / dist * step; pos.z += dz / dist * step;
      let diff = Math.atan2(dx, dz) - root.rotation.y;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      root.rotation.y += diff * Math.min(1, dt * 12);
    }
    const w = t * 8 + p.phase, swing = Math.sin(w) * 0.55;
    p.hipL.rotation.x = swing; p.hipR.rotation.x = -swing;
    p.kneeL.rotation.x = Math.max(0, -Math.sin(w - 0.6)) * 0.9;
    p.kneeR.rotation.x = Math.max(0, Math.sin(w - 0.6)) * 0.9;
    p.shoulderL.rotation.x = -swing * 0.7; p.shoulderR.rotation.x = swing * 0.7;
    p.elbowL.rotation.x = p.elbowR.rotation.x = -0.45;
    body.position.y = Math.abs(Math.cos(w)) * 0.05;
    head.rotation.set(0, 0, 0);
    return;
  }
  const sitting = pose === 'type' || pose === 'couch' || pose === 'beanbag';
  p.hipL.rotation.x = p.hipR.rotation.x = sitting ? -Math.PI / 2 : 0;
  p.kneeL.rotation.x = p.kneeR.rotation.x = sitting ? Math.PI / 2 : 0;
  body.position.y = pose === 'type' ? -0.08 : pose === 'couch' ? 0.02 : pose === 'beanbag' ? -0.18 : Math.sin(t * 1.6 + p.phase) * 0.008;
  if (pose === 'type') {
    p.shoulderL.rotation.x = -0.55 + Math.sin(t * 15 + p.phase) * 0.06;
    p.shoulderR.rotation.x = -0.55 + Math.sin(t * 15 + p.phase + 1.7) * 0.06;
    p.shoulderL.rotation.z = 0.12; p.shoulderR.rotation.z = -0.12;
    p.elbowL.rotation.x = p.elbowR.rotation.x = -1.0;
    head.rotation.set(-0.08 + Math.sin(t * 0.7 + p.phase) * 0.04, Math.sin(t * 0.5 + p.phase) * 0.12, 0);
  } else if (pose === 'pingpong') {
    const hit = Math.sin(t * 5 + (p.pose.at[0] > 6 ? Math.PI : 0));
    p.shoulderL.rotation.x = -0.3;
    p.shoulderR.rotation.x = -0.9 + hit * 0.45;
    p.shoulderR.rotation.z = -0.25 + hit * 0.25;
    p.elbowR.rotation.x = -0.7;
    body.position.y = Math.abs(Math.sin(t * 5)) * 0.04;
    p.hipL.rotation.x = 0.15; p.hipR.rotation.x = -0.15; p.kneeL.rotation.x = p.kneeR.rotation.x = 0.25;
  } else if (pose === 'coffee') {
    const sip = Math.max(0, Math.sin(t * 0.7 + p.phase));
    p.shoulderL.rotation.x = 0;
    p.shoulderR.rotation.x = -0.35 - sip * 0.35;
    p.elbowR.rotation.x = -1.7 - sip * 0.6;
    head.rotation.x = -sip * 0.15;
  } else if (pose === 'beanbag') {
    body.rotation.x = -0.3;
    p.hipL.rotation.x = p.hipR.rotation.x = -1.25;
    p.kneeL.rotation.x = p.kneeR.rotation.x = 0.9;
    p.shoulderL.rotation.x = p.shoulderR.rotation.x = -2.6;
    p.elbowL.rotation.x = p.elbowR.rotation.x = -1.9;
    head.rotation.set(0.1, Math.sin(t * 0.3 + p.phase) * 0.2, 0);
  } else if (pose === 'couch') {
    body.rotation.x = -0.1;
    p.shoulderL.rotation.x = p.shoulderR.rotation.x = -0.4;
    p.elbowL.rotation.x = p.elbowR.rotation.x = -0.6;
    p.shoulderL.rotation.z = 0.1; p.shoulderR.rotation.z = -0.1;
    head.rotation.set(0, Math.sin(t * 0.35 + p.phase) * 0.35, 0);
  } else {
    p.shoulderL.rotation.x = p.shoulderR.rotation.x = Math.sin(t * 1.6 + p.phase) * 0.04;
  }
}

// Ping pong rally between whoever is standing at the two ends.
function rally(t) {
  const players = Object.values(people).filter((p) => p.pose?.pose === 'pingpong' && !p.path.length && p.root.visible);
  const playing = players.length === 2;
  pingBall.visible = playing;
  for (const bat of spareBats) bat.visible = players.length === 0;
  if (!playing) return;
  const u = (Math.sin(t * 2.5 - Math.PI / 2) + 1) / 2;
  pingBall.position.set(4.75 + u * 2.9, 0.86 + Math.abs(Math.sin(t * 5)) * 0.45, -1.2 + Math.sin(t * 1.7) * 0.35);
}

function queueText(sab) {

  const lines = sab.queue.slice(0, 5).map((q, i) => {
    const name = q.name || q.title, short = name.length > 55 ? name.slice(0, 52).trimEnd() + '…' : name;
    return `${i + 1}. ${short}${i === 0 ? ` · ${Math.round(q.pct)}%` : ''}`;
  });
  return `Next in the queue (${sab.queueTotal})\n` + lines.join('\n');
}
$('labels').append(pileLabel);

function placeLabels() {
  for (const p of Object.values(people)) {
    const out = !p.root.visible;
    const pos = p.root.position;
    const [x, y] = out ? project(DESKS[p.i][0], 1.2, DESKS[p.i][1] + 1) : project(pos.x, pos.y + 2.05, pos.z);
    p.label.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
    p.label.style.zIndex = Math.round(y);
  }
  const [mx, my] = project(-8.0, 1.75, 7.05);
  dcTag.style.transform = `translate(${mx}px, ${my}px) translate(-50%, -100%)`;
  const [x, y] = project(0.0, 1.1, 0.95);
  pileLabel.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
}

// ---------- live data ----------
let first = true;
function render(d) {
  latestData = d;
  props.forEach((p) => p.update && p.update(d));
  d.services.forEach((svc, i) => {
    const p = people[svc.name] || (people[svc.name] = makePerson(svc.name, i % DESKS.length));
    const bad = svc.issues.some((a) => a.level === 'error');
    const issue = svc.issues.map((a) => a.message).join('\n');
    const desk = desks[p.i];
    const on = svc.up && !!svc.task;
    desk.screenMat.emissive.set(on ? p.s.color : '#000000');
    desk.screenMat.emissiveIntensity = on ? 1.1 : 0;
    p.root.visible = svc.up;
    p.label.querySelector('.dot').className = 'dot ' + (!svc.up || bad ? 'error' : svc.issues.length ? 'warning' : '');
    const status = p.label.querySelector('span');
    // Where they are already says whether they're working; only a missing worker needs saying.
    status.textContent = svc.up ? '' : 'out';
    status.className = svc.up ? '' : 'out';
    const badge = p.label.querySelector('.badge');
    badge.classList.toggle('show', svc.issues.length > 0);
    badge.classList.toggle('error', bad || !svc.up);
    Object.assign(p, { up: svc.up, task: svc.task, issue });
    if (!svc.up) { p.where = null; p.path = []; return; }
    send(p, svc.task ? 'desk' : 'break', first);
  });
  first = false;

  const sab = d.sab, busy = d.services.filter((s) => s.up && s.task).length, down = d.services.filter((s) => !s.up).length;
  $('summary').textContent = `${busy} working · ${d.services.length - busy - down} on a break${down ? ` · ${down} out` : ''}`;
  $('srStatus').textContent = d.services.map((s) => `${s.name}: ${!s.up ? 'not running' : s.task || 'on a break'}`).join('. ');
  const queued = sab.ok ? sab.queueTotal : 0;
  parcels.forEach((b, i) => { b.visible = i < queued; });
  pileLabel.textContent = queued ? `📦 ${queued} in queue` : '';
  latestSab = sab;
  pileLabel.style.display = queued ? '' : 'none';
  const rate = sab.ok ? sab.speed : 0;
  const speed = rate >= 1048576 ? (rate / 1048576).toFixed(1) + ' MB/s' : Math.round(rate / 1024) + ' KB/s';
  updateBoard(d);
  const streams = d.cinema.streams || [];
  const recent = [...(d.radarr.recent || []).map((m) => ({ title: m.title, sub: m.year ? String(m.year) : '', poster: m.poster, when: m.when })),
    ...(d.sonarr.recent || []).map((m) => ({ title: m.title, sub: m.sub || '', poster: m.poster, when: m.when }))]
    .sort((a, b) => String(b.when).localeCompare(String(a.when))).slice(0, 4);
  const viewers = (d.cinema.profiles || []).map((name) => {
    const st = streams.find((x) => x.who === name);
    return { name, initials: name.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase(), watching: !!st, title: st && st.title };
  });
  showPosters(recent);
  const key = JSON.stringify(viewers);
  if (key !== board.key) { board.key = key; board.redraw({ viewers }); }
  board.viewers = viewers;
  // the parcel pile: hover it to see what's next
  pileLabel.dataset.tip = queueText(sab);
}

async function tick() {
  if (document.hidden) return;
  try {
    const r = await fetch('/api/data', { cache: 'no-store' });
    if (r.status === 401) { location.href = '/login'; return; }
    render(await r.json());
  } catch { $('summary').textContent = 'Dashboard not responding'; }
}

// ---------- hover popups: what someone is doing, and any problems ----------
const tip = $('tip');
const BREAK_TEXT = { couch: 'Relaxing on the couch', pingpong: 'Playing ping pong', coffee: 'Having a coffee', beanbag: 'Chilling on a bean bag' };
function doing(p) {
  if (!p.up) return `${p.name}\nNot running` + (p.issue ? `\n⚠ ${p.issue}` : '');
  const short = (t) => (t && t.length > 70 ? t.slice(0, 67).trimEnd() + '…' : t);
  let text = short(p.task) || (p.path.length ? (p.where === 'desk' ? 'Heading to the desk' : 'Heading to the break room') : BREAK_TEXT[p.pose?.pose] || 'On a break');
  if (!p.task) text += `\n“${p.s.quips[Math.floor(Date.now() / 15000) % p.s.quips.length]}”`;
  return `${p.name}\n${text}` + (p.issue ? `\n⚠ ${p.issue}` : '');
}
function showTip(text, x, y) {
  tip.textContent = text;
  tip.style.display = 'block';
  tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - tip.offsetWidth - 8)) + 'px';
  tip.style.top = Math.max(8, y - tip.offsetHeight - 12) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };
document.addEventListener('mouseover', (e) => {
  const el = e.target.closest && e.target.closest('[data-person], [data-tip]');
  if (!el) return;
  const r = el.getBoundingClientRect();
  showTip(el.dataset.person ? doing(people[el.dataset.person]) : el.dataset.tip, r.left, r.top);
});
document.addEventListener('mouseout', (e) => { if (e.target.closest && e.target.closest('[data-person], [data-tip]')) hideTip(); });
// pointing at a character in the room
const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.buttons) return hideTip();
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set((e.clientX - r.left) / r.width * 2 - 1, 1 - (e.clientY - r.top) / r.height * 2);
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObjects([...Object.values(people).filter((p) => p.root.visible).map((p) => p.root), ...parcels.filter((b) => b.visible), ...wallPosters.map((p) => p.mesh), ...pickables, boardScreen], true)[0];
  if (hit && hit.object === boardScreen) {
    const px = hit.uv.x * BOARD_W, py = (1 - hit.uv.y) * BOARD_H, viewers = board.viewers || [];
    const i = boardCircles(viewers.length).findIndex(({ cx, cy, r }) => Math.hypot(px - cx, py - cy) <= r + 4);
    const v = viewers[i];
    renderer.domElement.style.cursor = v && v.watching ? 'pointer' : '';
    return v && v.watching ? showTip(`${v.name} is watching\n${v.title}`, e.clientX, e.clientY) : hideTip();
  }
  let o = hit && hit.object;
  while (o && !o.userData.person && !parcels.includes(o) && !o.userData.poster && !o.userData.tip) o = o.parent;
  if (o && o.userData.poster === null) o = null;
  renderer.domElement.style.cursor = o ? 'pointer' : '';
  if (o && o.userData.person) showTip(doing(o.userData.person), e.clientX, e.clientY);
  else if (o && o.userData.poster) showTip(o.userData.poster, e.clientX, e.clientY);
  else if (o && o.userData.tip) showTip(typeof o.userData.tip === 'function' ? o.userData.tip() : o.userData.tip, e.clientX, e.clientY);
  else if (o) showTip(queueText(latestSab), e.clientX, e.clientY);
  else hideTip();
});
renderer.domElement.addEventListener('pointerleave', hideTip);

// ---------- props: one module per extra service, loaded from /office_props ----------
const props = [], pickables = [];
let latestData = null, skyAt = -99;
const kit = {
  THREE, scene, camera, add, mat, box, rbox, cyl, ball, capsule, torus, group, plane, canvasTexture, fitText,
  windows: WINDOWS, sky, skyMat, sunAltitude, nowDate, pickables,
  // hover text for a prop: a string, or a function giving one
  tipOn(obj, tip) { obj.userData.tip = tip; if (!pickables.includes(obj)) pickables.push(obj); },
};
fetch('/office_props/index.json').then((r) => r.json()).then((names) => names.forEach((n) => import(`/office_props/${n}.js`).then((m) => {
  const p = m.default(kit);
  if (p) { props.push(p); if (latestData && p.update) p.update(latestData); }
}).catch((e) => console.error('prop', n, e)))).catch(() => {});

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  for (const p of Object.values(people)) if (p.root.visible) animate(p, dt, t);
  code.offset.y = (code.offset.y + dt * 0.08) % 1;
  rally(t);
  animateDataCenter(dt);
  props.forEach((p) => p.frame && p.frame(dt, t));
  if (t - skyAt > 30) { skyAt = t; const alt = sunAltitude(); sky.redraw(alt); skyMat.emissiveIntensity = 0.3 + 0.25 * Math.min(1, Math.max(0, (alt + 6) / 12)); }
  const now = new Date();
  const hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  if (hhmm !== clockFace.shown) { clockFace.shown = hhmm; clockFace.redraw(hhmm); }
  controls.update();
  renderer.render(scene, camera);
  placeLabels();
  requestAnimationFrame(frame);
}
resize();
frame();
document.addEventListener('visibilitychange', tick);
tick();
setInterval(tick, 2000);
window.office = { people, render, controls, board, renderer, scene, camera };
</script>
</body>
